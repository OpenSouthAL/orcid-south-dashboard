name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # # Daily, to refresh the ORCID account snapshot
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh the ORCID snapshot; if ORCID is unavailable, deploy the committed one
      - name: Snapshot ORCID accounts
        continue-on-error: true
        run: node scripts/build-accounts.ts
      - run: npm run check
      - run: npm run build

      # Secrets are unavailable to pull requests from forks, so only deploy from this repo
      - name: Deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --project-name=orcid-south-dashboard --branch=${{ github.head_ref || github.ref_name }}
